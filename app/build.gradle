plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anka.oyunclub'
    compileSdk 34

    defaultConfig {
        applicationId "com.anka.oyunclub"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        debug {
            storeFile file('anka.jks')
            storePassword 'ankapass123'
            keyAlias 'anka'
            keyPassword 'ankapass123'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-database:20.3.0'
    implementation 'androidx.annotation:annotation:1.7.0'
}
