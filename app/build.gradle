plugins { 
    id 'com.android.application' 
}

android {
    namespace 'com.anka.oyunclub'
    compileSdk 34

    defaultConfig {
        applicationId "com.anka.oyunclub"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.3.2"
        
        // 🚀 İŞTE EKSİK OLAN KRİTİK SATIR: Multi-dex desteğini açıyoruz!
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            storeFile file('anka.jks')
            storePassword 'ankapass123'
            keyAlias 'anka'
            keyPassword 'ankapass123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Eski Android'lerle daha barışık olması için Java 8 veya 11 en güvenlisidir
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // 🚀 Multi-dex kütüphanesini projeye ekliyoruz ki eski cihazlar sınıfları okuyabilsin
    implementation 'androidx.multidex:multidex:2.0.1'
}
