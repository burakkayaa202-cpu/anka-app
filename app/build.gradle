plugins { 
    id 'com.android.application' 
}

android {
    namespace 'com.anka.oyunclub'
    compileSdk 34

    defaultConfig {
        applicationId "com.anka.oyunclub"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.2"
    }

    signingConfigs {
        debug {
            storeFile file('anka.jks')
            storePassword 'ankapass123'
            keyAlias 'anka'
            keyPassword 'ankapass123'
        }
    }

    buildTypes {
        release {
            // Eğer release için de bu imzayı kullanacaksanız:
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
